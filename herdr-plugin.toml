id = "extrakto-herdr"
name = "Extrakto"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Extract text tokens (paths, URLs, words, lines) from the pane and fuzzy-pick with fzf. Inspired by extrakto for tmux."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Extrakto"
command = ["python3", "./bin/extrakto-herdr.py"]

[[actions]]
id = "open-url"
title = "Extrakto (URLs)"
command = ["./bin/extrakto-herdr", "url"]

[[actions]]
id = "open-path"
title = "Extrakto (Paths)"
command = ["./bin/extrakto-herdr", "path"]

[[actions]]
id = "open-line"
title = "Extrakto (Lines)"
command = ["./bin/extrakto-herdr", "line"]

[[panes]]
id = "picker"
title = "Extrakto"
placement = "popup"
width = "50%"
height = "50%"
command = ["python3", "./extrakto_herdr.py"]
